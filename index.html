<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Ton script -->
  <script src="sketch.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: clamp(16px, 4vw, 40px);
    }

    /* ⭐ Le titre n'ajoute PLUS d'espace inutile, et s'adapte à la largeur d'écran */
    h2 {
      margin: 0;            /* enlève la marge haute et basse */
      padding: 0;           /* enlève le padding interne */
      line-height: 1.4;
      font-weight: normal;
      font-size: clamp(0.95rem, 1.1vw + 0.6rem, 1.4rem);
    }

    #chart {
      width: 100%;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

  <h2>
    2025: Diensttage nach Tätigkeitsbereich / Jours de service par domaine d'activité / Giorni di servizio per ambiti d’attività
  </h2>

  <div id="chart"></div>

</body>
</html>
